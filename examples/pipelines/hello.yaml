version: "1.4"
name: hello_pipeline
inputs:
  raw_data: {}
outputs: {}
params:
  limit:
    max_total_node_calls: 100
graph:
  nodes:
    - id: preprocess
      type: python_script
      inputs:
        data: ${inputs.raw_data}
      params:
        script: scripts/preprocess.py
    - id: llm_call
      type: llm
      inputs:
        prompt: ${preprocess.result.prompt_text}
      params: {}
    - id: postprocess
      type: python_script
      inputs:
        data: ${llm_call.response.value}
      params:
        script: scripts/postprocess.py
  final: postprocess
