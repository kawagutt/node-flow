# Example: fixed implement_with_codex pipe — nested exec argv is required (no defaults).
version: "1.5"
name: implement_with_codex_sample
graph:
  nodes:
    - id: iwc
      type: implement_with_codex
      inputs:
        task_type: ${inputs.task_type}
        task_prompt: ${inputs.task_prompt}
      params:
        codex_exec:
          argv: ["sh", "-c", "echo implement-sample"]
  final: iwc
