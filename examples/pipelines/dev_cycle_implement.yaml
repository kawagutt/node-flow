# Development flow P0: stage 2 (implementation) single-run pipeline.
# Use `approved_checkpoint_path` (JSON with top-level "spec" and "plan" strings); see development_flow README.
version: "1.5"
name: dev_cycle_implement
inputs:
  approved_checkpoint_path: {}
  repo_root: {}
  base_ref: {}
  task_type: {}
graph:
  nodes:
    - id: implement
      type: workflows.development_flow.implement
      inputs:
        approved_checkpoint_path: ${inputs.approved_checkpoint_path}
        repo_root: ${inputs.repo_root}
        base_ref: ${inputs.base_ref}
        task_type: ${inputs.task_type}
      params:
        codex_exec:
          argv:
            - python3
            - -c
            - |
              import sys
              sys.stdin.read()
              print("hermetic implement stub ok")
        run_tests:
          argv: ["python3", "-c", "print('hermetic tests ok')"]
        write_checkpoint:
          checkpoint_dir: .nodeflow/checkpoints
          run_id: "002"
  final: implement
