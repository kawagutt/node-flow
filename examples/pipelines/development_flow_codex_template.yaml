# NOT RUNNABLE AS-IS — template for real Codex CLI.
# Copy, replace every `codex exec ... cat` with your verified invocation, then merge argv into params.
# For a working hermetic graph, use `development_flow_hermetic.yaml`.
version: "1.5"
name: development_flow_codex_template
inputs:
  action: {}
  task_prompt: {}
  repo_root: {}
  flow_checkpoint_path: {}
  human_comment_path: {}
  human_comment_text: {}
  planned_branch_name: {}
  development_name: {}
  run_id: {}
graph:
  nodes:
    - id: flow
      type: development_flow_pipe
      inputs:
        action: ${inputs.action}
        task_prompt: ${inputs.task_prompt}
        repo_root: ${inputs.repo_root}
        flow_checkpoint_path: ${inputs.flow_checkpoint_path}
        human_comment_path: ${inputs.human_comment_path}
        human_comment_text: ${inputs.human_comment_text}
        planned_branch_name: ${inputs.planned_branch_name}
        development_name: ${inputs.development_name}
        run_id: ${inputs.run_id}
      params:
        prepare_development_run_context:
          branch_prefix: feat/nodeflow
          artifact_root_dir: .nodeflow/runs
        prepare_workspace:
          strategy: current_repo
        flow_checkpoint:
          checkpoint_dir: .nodeflow/checkpoints
        spec_plan_pipe:
          codex_exec:
            argv: ["codex", "exec", "--model", "REPLACE_ME", "--", "cat"]
        implement_pipe:
          codex_exec:
            argv: ["codex", "exec", "--model", "REPLACE_ME", "--", "cat"]
          run_tests:
            argv: ["python3", "-m", "pytest", "-q"]
        review_pipe:
          review_diff_focused:
            argv: ["codex", "exec", "--model", "REPLACE_ME", "--", "cat"]
          review_wide_scan:
            argv: ["codex", "exec", "--model", "REPLACE_ME", "--", "cat"]
          review_test_focused:
            argv: ["codex", "exec", "--model", "REPLACE_ME", "--", "cat"]
          review_spec_conformance:
            argv: ["codex", "exec", "--model", "REPLACE_ME", "--", "cat"]
          review_spec_revision:
            argv: ["codex", "exec", "--model", "REPLACE_ME", "--", "cat"]
  final: flow
